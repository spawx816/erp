version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sgc_erp_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=sgc_super_secret_enterprise_jwt_key_2026_cambri
    volumes:
      - ./backend/data:/app/data
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sgc_erp_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
