version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sgc_erp_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus_erp}
      POSTGRES_USER: ${DB_USER:-educrm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-NuevaPasswordSegura}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-educrm_user} -d ${DB_NAME:-nexus_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sgc_erp_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nexus_erp}
      - DB_USER=${DB_USER:-educrm_user}
      - DB_PASSWORD=${DB_PASSWORD:-NuevaPasswordSegura}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sgc_erp_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
