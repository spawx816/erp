name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Backend Syntax
        run: |
          cd backend
          npm install --production=false
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');
            function checkDir(dir) {
              fs.readdirSync(dir).forEach(file => {
                const full = path.join(dir, file);
                if (fs.statSync(full).isDirectory()) checkDir(full);
                else if (file.endsWith('.js')) {
                  try { execSync('node --check ' + full); }
                  catch(e) { console.error('Syntax error in ' + full); process.exit(1); }
                }
              });
            }
            checkDir('src');
            console.log('All backend files passed syntax check.');
          "

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/nexus-erp
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy.sh
            bash deploy.sh
